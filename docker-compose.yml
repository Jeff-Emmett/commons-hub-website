services:
  web:
    container_name: commons-hub-web
    build:
      context: .
      args:
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-https://admin.commons-hub.at}
        # PUBLIC (HTTP-referrer-restricted) Maps Embed key. Inlined at build time;
        # commit 400bc5e moved it out of source, so it must be supplied here or the
        # map iframe renders with an empty key and breaks.
        NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY:-AIzaSyByUGav-hWsEfsBhAYrb_sFVZNlB67AooA}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      # Infisical machine identity (the only secrets in .env). entrypoint.sh uses
      # these to fetch all deployment secrets from Infisical at container start and
      # overlay them onto the vars below. Reaches Infisical over the shared
      # traefik-public network at http://infisical:8080 (bypasses Cloudflare Access).
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_SLUG: ${INFISICAL_PROJECT_SLUG:-commons-hub-app}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_URL: ${INFISICAL_URL:-http://infisical:8080}
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-https://admin.commons-hub.at}
      DIRECTUS_URL: ${DIRECTUS_URL:-http://commons-hub-directus:8055}
      LISTMONK_URL: ${LISTMONK_URL:-http://commons-hub-listmonk:9000}
      LISTMONK_TOKEN: ${LISTMONK_TOKEN}
      LISTMONK_LIST_ID: ${LISTMONK_LIST_ID}
      LISTMONK_TEMPLATE_ID: ${LISTMONK_TEMPLATE_ID}
      # Optional. listmonk's `messenger` field on /api/tx only accepts
      # the canonical messenger key (typically "email" for SMTP), not
      # the per-connection display name. With one SMTP messenger
      # configured, leave this unset so listmonk uses the default.
      LISTMONK_MESSENGER: ${LISTMONK_MESSENGER:-}
      # Booking inquiry notifications. Real values (host/user/pass/from/recipients)
      # come from Infisical prod via entrypoint.sh; the defaults below are just
      # empty fallbacks. Reply-To on each message is the customer's email so staff
      # can reply directly to them. Recipient list is MAIL_TO_OFFICE in Infisical.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO_OFFICE: ${MAIL_TO_OFFICE:-}
    networks:
      - traefik-public
      - commons-hub-directus-net
      - commons-hub-listmonk-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.commons-hub-web.rule=Host(`commons-hub.at`) || Host(`www.commons-hub.at`)
      - traefik.http.routers.commons-hub-web.entrypoints=web
      - traefik.http.routers.commons-hub-web.service=commons-hub-web
      - traefik.http.services.commons-hub-web.loadbalancer.server.port=3000

networks:
  traefik-public:
    external: true
  commons-hub-directus-net:
    external: true
  commons-hub-listmonk-internal:
    external: true
